name: Build deploy image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to publish (ghcr.io/xiaoli0412/aether:<tag>)'
        required: false
        default: 'feat-build'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: xiaoli0412/aether

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build linux-amd64 gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: deploy-linux-amd64
          workspaces: . -> target

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build
        env:
          AETHER_VERSION: ${{ github.event.inputs.image_tag || 'feat-build' }}
          AETHER_BUILD_TYPE: release
          CARGO_TERM_COLOR: always
        shell: bash
        run: cross build --release --locked -p aether-gateway --target x86_64-unknown-linux-musl

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: aether-gateway-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/aether-gateway
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Build & push Docker image
    needs: [frontend, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare dist layout
        run: |
          mkdir -p dist
          cp artifacts/aether-gateway-linux-amd64/aether-gateway dist/aether-gateway-amd64
          chmod +x dist/aether-gateway-amd64
          cp -r artifacts/frontend-dist dist/frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.app
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.event.inputs.image_tag || 'feat-build' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
